[project]
name = "lantern-kb"
version = "0.1.0"
description = "Local-first knowledge base. Ask your own folders offline, with optional Ollama answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bh" }]
keywords = ["rag", "knowledge-base", "ollama", "local-first", "search"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "pypdf>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
lantern = "lantern.cli:main"

[project.urls]
Homepage = "https://github.com/Bh144917/lantern-kb"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lantern = ["web/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
